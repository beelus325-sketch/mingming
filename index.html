<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>鸣鸣很忙 · 欢迎来到玩具城</title>
<meta name="description" content="省钱就逛鸣鸣很忙">
<meta property="og:type" content="article">
<meta property="og:site_name" content="鸣鸣很忙">
<meta property="og:title" content="鸣鸣很忙 · 欢迎来到玩具城">
<meta property="og:description" content="省钱就逛鸣鸣很忙">
<meta property="og:url" content="https://beelus325-sketch.github.io/mingming/">
<meta property="og:image" content="https://beelus325-sketch.github.io/mingming/cover.jpg">
<meta property="og:image:width" content="720">
<meta property="og:image:height" content="720">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #eef3f7; }
  body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }
  .page { max-width: 720px; margin: 0 auto; }
  .screen { position: relative; width: 100%; }
  .screen.first img, .screen.first video { display: block; width: 100%; height: auto; }
  .screen.first video { aspect-ratio: 720 / 1280; background: #71b8e6; }
  .screen.second { aspect-ratio: 720 / 1280; overflow: hidden; }
  .screen.second .base {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; display: block;
  }
  .carousel {
    position: absolute; left: 6%; top: 16%; width: 88%;
    aspect-ratio: 1300 / 1718; overflow: hidden;
  }
  .track { display: flex; width: 300%; height: 100%; transition: transform .42s ease; }
  .slide { flex: 0 0 33.333333%; height: 100%; }
  .slide img { width: 100%; height: 100%; object-fit: contain; display: block; -webkit-user-drag: none; }
  .nav {
    position: absolute; top: 48.7%; transform: translateY(-50%);
    width: 40px; height: 40px; border-radius: 50%;
    border: 1px solid rgba(255,255,255,.65); background: rgba(255,255,255,.22);
    color: #fff; font-size: 24px; line-height: 1; cursor: pointer;
    display: flex; align-items: center; justify-content: center; padding: 0;
    -webkit-tap-highlight-color: transparent;
  }
  .nav:active { background: rgba(255,255,255,.4); }
  .nav.prev { left: 3%; }
  .nav.next { right: 3%; }
</style>
</head>
<body>
<div class="page">
  <section class="screen first">
    <video class="hero" src="assets/hero.mp4" autoplay loop muted playsinline webkit-playsinline preload="auto"></video>
  </section>
  <section class="screen second">
    <img class="base" src="assets/base.webp" alt="">
    <div class="carousel" id="carousel">
      <div class="track" id="track">
        <div class="slide"><img src="assets/card1.webp" alt="轮换素材1"></div>
        <div class="slide"><img src="assets/card2.webp" alt="轮换素材2"></div>
        <div class="slide"><img src="assets/card3.webp" alt="轮换素材3"></div>
      </div>
    </div>
    <button class="nav prev" id="prev" aria-label="上一个">‹</button>
    <button class="nav next" id="next" aria-label="下一个">›</button>
  </section>
</div>
<script>
  (function () {
    var track = document.getElementById('track');
    var carousel = document.getElementById('carousel');
    var slides = track.children.length;
    var idx = 0;
    var auto = null;

    function render() {
      track.style.transform = 'translateX(' + (-idx * 100 / 3) + '%)';
    }
    function go(i) { idx = (i + slides) % slides; render(); }
    function next() { go(idx + 1); }
    function prev() { go(idx - 1); }
    function stopAuto() { if (auto) { clearInterval(auto); auto = null; } }

    auto = setInterval(next, 1000);

    document.getElementById('next').addEventListener('click', function () { stopAuto(); next(); });
    document.getElementById('prev').addEventListener('click', function () { stopAuto(); prev(); });

    var sx = 0, sy = 0;
    carousel.addEventListener('touchstart', function (e) {
      sx = e.touches[0].clientX; sy = e.touches[0].clientY;
    }, { passive: true });
    carousel.addEventListener('touchend', function (e) {
      var dx = e.changedTouches[0].clientX - sx;
      var dy = e.changedTouches[0].clientY - sy;
      if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) {
        stopAuto();
        if (dx < 0) { next(); } else { prev(); }
      }
    }, { passive: true });

    render();
    var heroVideo = document.querySelector('.first video');
    if (heroVideo) { heroVideo.play().catch(function () {}); }
  })();
</script>
</body>
</html>
